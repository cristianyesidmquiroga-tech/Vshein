<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vshein{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">
      <img class="brand-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Shein Vélez Logo">
      <span>Shein Vélez</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" data-menu-toggle>Menu</button>
    <nav class="nav" data-nav>
      <a href="{{ url_for('main.index') }}#inicio">Inicio</a>
      <a href="{{ url_for('main.index') }}#productos">Productos</a>
      <a href="{{ url_for('main.index') }}#quienes-somos">Quienes somos</a>
      <a href="{{ url_for('main.index') }}#contacto">Contactanos</a>
      <a href="{{ url_for('admin.dashboard') }}">Administracion</a>
    </nav>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
