<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Miss Lindas{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/marca/logo-sv.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site/footer.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">
      <img class="brand-logo" src="{{ url_for('static', filename='img/marca/logo-sv.png') }}" alt="Miss Lindas Logo">
      <span>Miss Lindas</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" data-menu-toggle>Menu</button>
    <nav class="nav" data-nav>
      <a href="{{ url_for('main.index') }}#inicio">Inicio</a>
      <a href="{{ url_for('main.index') }}#ropa">Ropa</a>
      <a href="{{ url_for('main.index') }}#accesorios">Accesorios</a>
      <a href="{{ url_for('main.index') }}#contacto">Contacto</a>
    </nav>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  {% include "landing/_footer.html" %}

  <script src="{{ url_for('static', filename='js/site/main.js') }}"></script>
</body>
</html>
