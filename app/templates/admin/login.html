<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | Vshein</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-body">
  <main class="auth-card reveal">
    <p class="eyebrow">Acceso administrativo</p>
    <h1>Iniciar sesion</h1>
    <p>Usa tu cuenta de empleado o administrador.</p>
    <form method="post" class="auth-form">
      <label>
        Correo
        <input type="email" name="email" placeholder="admin@vshein.local" required>
      </label>
      <label>
        Contrasena
        <input type="password" name="password" placeholder="Admin123!" required>
      </label>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
    <a class="back-link" href="{{ url_for('main.index') }}">Volver a la landing</a>
  </main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
